name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Sometimes SSH sessions in GH Actions don't load the Node path (NVM). 
          # We force the path initialization and run the commands.
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /home/ubuntu/kontfeel-calculator
            
            echo "Récupération des dernières modifications depuis GitHub..."
            git pull origin main
            
            echo "Installation des dépendances..."
            npm install
            
            echo "Génération de Prisma..."
            npx prisma generate
            
            echo "Génération du build de production Next.js..."
            npm run build
            
            echo "Redémarrage de l'application..."
            pm2 reload all
